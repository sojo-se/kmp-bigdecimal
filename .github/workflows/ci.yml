name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm-js-wasm:
    name: JVM, JS and Wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Make wrapper executable
        run: chmod +x gradlew
      - name: Run tests
        run: ./gradlew :jvmTest :jsNodeTest :wasmJsNodeTest

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - name: Make wrapper executable
        run: chmod +x gradlew
      - name: Run Android unit tests and build the release AAR
        run: ./gradlew :testDebugUnitTest :assembleRelease

  ios:
    name: iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Make wrapper executable
        run: chmod +x gradlew
      - name: Compile the iOS simulator target
        run: ./gradlew :compileKotlinIosSimulatorArm64
